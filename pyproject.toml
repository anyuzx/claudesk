[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudesk"
version = "0.3.0"
description = "Personal research assistant — paper digest, todos, and progress tracking"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "typer[all]>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "rich>=13.0",
    "openai>=1.0",
    "pydantic-ai-slim[openai,google,anthropic]>=1.92.0,<2",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "uvicorn[standard]>=0.29",
    "mcp>=1.12.4,<2",
    "lancedb>=0.17",
    "rapidfuzz>=3.9",
]

[project.scripts]
claudesk = "claudesk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["claudesk"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/data",
    "/frontend/node_modules",
    "/frontend/dist",
    "/frontend/test-results",
    "/frontend/playwright-report",
    "/frontend/blob-report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
